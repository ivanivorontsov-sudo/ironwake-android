<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>IRONWAKE</title>
  <style>
    html,body{margin:0;height:100%;background:#0c0d0c;color:#e8e4d8;font-family:system-ui,sans-serif;overflow:hidden}
    #ui{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
    header{padding:10px 14px;display:flex;justify-content:space-between;gap:12px;pointer-events:auto}
    .muted{color:#9a9a8c;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-size:22px}
    #st{font-size:13px}
    .ok{color:#7aa06c}.bad{color:#c07060}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #dock{position:absolute;left:0;right:0;bottom:0;padding:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
    .pad{width:132px;height:132px;border:1px solid #3a3d36;border-radius:50%;background:#161714cc;pointer-events:auto;position:relative}
    .knob{width:46px;height:46px;border-radius:50%;background:#c4b48a;position:absolute;left:43px;top:43px}
    #fire{width:86px;height:86px;border-radius:50%;border:0;background:#8b3a32;color:#f3eee2;font-weight:700;pointer-events:auto}
    #join{pointer-events:auto;background:#2b3326;color:#e8e4d8;border:1px solid #5a6a4a;padding:8px 14px}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <header>
    <div>
      <p class="muted">Combat client</p>
      <h1>IRONWAKE</h1>
      <div id="st" class="muted">подключение…</div>
    </div>
    <button id="join">В БОЙ</button>
  </header>
  <div id="dock">
    <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
    <button id="fire">ОГОНЬ</button>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const API = (q.get("api") || (location.protocol.startsWith("http") && location.host.indexOf("biker9td") >= 0 ? location.origin : "http://biker9td.beget.tech")).replace(/\/$/,"");
const st = document.getElementById("st");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let units = [], yaw = 0, vx = 0, vz = 0, x = 8, z = 22, fireUntil = 0, joined = false, team = "blue";
const id = "a" + Math.random().toString(36).slice(2, 8);
const room = "public";
const SCALE = 14;
function setSt(ok, t){ st.className = ok ? "ok" : "bad"; st.textContent = t; }
function resize(){ canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();
function post(path, body){
  return fetch(API + path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
}
fetch(API + "/health").then(r=>r.json()).then(j=>{
  setSt(j.ok, j.ok ? "HTTP-канал готов" : ("база: " + (j.error||"down")));
}).catch(()=>setSt(false, "сервер недоступен"));
async function connect(){
  try {
    const r = await post("/room/join", { room, mode:"laststand", userId:id, callsign:"ANDROID", vehicleId:"k72-ural" });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "join fail");
    joined = true;
    team = j.team || "blue";
    if (team === "red") { x = -8; z = -22; }
    setSt(true, "в бою · " + team + " · танк в центре");
  } catch (e) {
    setSt(false, "join: " + e.message);
  }
}
document.getElementById("join").onclick = connect;
function sendInput(extra){
  if (!joined) return;
  post("/room/input", Object.assign({ room, userId:id, x, y:0, z, yaw, turretYaw:yaw, gunPitch:0 }, extra||{})).catch(()=>{});
}
const pad = document.getElementById("pad"), knob = document.getElementById("knob");
function stick(ev){
  const t = ev.touches ? ev.touches[0] : ev;
  const r = pad.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const max = r.width/2 - 8, len = Math.hypot(dx,dy)||1;
  if (len > max) { dx *= max/len; dy *= max/len; }
  knob.style.left = (r.width/2 + dx - 23) + "px";
  knob.style.top = (r.height/2 + dy - 23) + "px";
  vx = dx / max; vz = dy / max;
  yaw = Math.atan2(dx, -dy);
}
function resetStick(){ vx=0; vz=0; knob.style.left="43px"; knob.style.top="43px"; }
pad.addEventListener("pointerdown", stick);
pad.addEventListener("pointermove", (e)=>{ if (e.buttons) stick(e); });
pad.addEventListener("pointerup", resetStick);
pad.addEventListener("touchstart", stick, {passive:true});
pad.addEventListener("touchmove", stick, {passive:true});
pad.addEventListener("touchend", resetStick);
document.getElementById("fire").onclick = () => {
  fireUntil = performance.now() + 180;
  const target = units.find(u => u.id !== id && u.alive);
  sendInput(target ? { hit: { target: target.id, module: "hull_front", damage: 90 } } : {});
};
setInterval(() => {
  x += vx * 1.4;
  z += vz * 1.4;
  sendInput();
}, 80);
setInterval(async () => {
  try {
    const r = await fetch(API + "/room/state?room=" + room);
    const j = await r.json();
    units = (j.payload && j.payload.units) || [];
    const mine = units.find(u => u.id === id);
    if (mine) { x = mine.x; z = mine.z; yaw = mine.yaw; }
  } catch {}
}, 120);
function drawTank(u, isMe){
  ctx.save();
  ctx.translate(u.x * SCALE, -u.z * SCALE);
  ctx.rotate(u.yaw || 0);
  ctx.globalAlpha = u.alive === false ? .35 : 1;
  ctx.fillStyle = isMe ? "#d7c48a" : (u.team === "blue" ? "#4a7aa8" : "#a85a4a");
  ctx.fillRect(-12, -20, 24, 40);
  ctx.fillStyle = "#1a1c16";
  ctx.fillRect(-4, -26, 8, 22);
  ctx.restore();
  ctx.fillStyle = "#e8e4d8";
  ctx.font = "12px sans-serif";
  ctx.fillText((u.callsign || u.id) + " " + Math.max(0, Math.round(u.hp || 0)), u.x * SCALE - 22, -u.z * SCALE - 28);
}
function draw(){
  requestAnimationFrame(draw);
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = "#12140f"; ctx.fillRect(0,0,w,h);
  ctx.save();
  ctx.translate(w/2, h * 0.52);
  ctx.translate(-x * SCALE, z * SCALE);
  ctx.strokeStyle = "#2a2d24"; ctx.lineWidth = 2;
  for (let i = -20; i <= 20; i++) {
    ctx.beginPath(); ctx.moveTo(i * 40, -800); ctx.lineTo(i * 40, 800); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-800, i * 40); ctx.lineTo(800, i * 40); ctx.stroke();
  }
  const list = units.slice();
  if (!list.some(u => u.id === id)) list.push({ id, x, z, yaw, team, hp: 1800, alive: true, callsign: "ANDROID" });
  for (const u of list) drawTank(u, u.id === id);
  ctx.restore();
  if (performance.now() < fireUntil) {
    ctx.fillStyle = "rgba(200,80,40,.18)"; ctx.fillRect(0,0,w,h);
  }
}
draw();
</script>
</body>
</html>
