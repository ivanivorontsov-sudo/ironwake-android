name: Godot 4 syntax and scene validation
on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-4-validation.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-4-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          GODOT_VERSION="4.4.1"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --retry-all-errors "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "$(dirname "$GODOT_BIN")" >> "$GITHUB_PATH"
          "$GODOT_BIN" --version
      - name: Validate project
        working-directory: godot/Ironwake
        run: |
          godot --headless --editor --path . --quit-after 5
          test -f project.godot
          test -f scenes/battle.tscn
          echo "Godot 4 project validation OK"
