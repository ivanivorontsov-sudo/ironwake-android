name: Build Godot 4.4 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - graphics-overhaul-2026-09
    paths:
      - "godot/Ironwake/**"
      - ".github/workflows/build-godot-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.4"
      GODOT_ROOT: "${{ github.workspace }}/godot-bin"
      GODOT_ANDROID: "${{ github.workspace }}/godot-bin/android"
      PROJECT_DIR: "${{ github.workspace }}/godot/Ironwake"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Godot 4.4 Linux binary
        run: |
          set -euxo pipefail
          mkdir -p "$GODOT_ROOT"
          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_ROOT"
          mv "$GODOT_ROOT/Godot_v4.4-stable_linux.x86_64" "$GODOT_ROOT/godot"
          chmod +x "$GODOT_ROOT/godot"
          "$GODOT_ROOT/godot" --version

      - name: Download official Godot 4.4 Android export templates
        run: |
          set -euxo pipefail
          mkdir -p "$GODOT_ANDROID"
          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$GODOT_ANDROID/templates"
          if [ -d /tmp/templates/templates ]; then
            cp -a /tmp/templates/templates/. "$GODOT_ANDROID/templates/"
          else
            cp -a /tmp/templates/. "$GODOT_ANDROID/templates/"
          fi
          find "$GODOT_ANDROID/templates" -maxdepth 2 -type f -print

      - name: Install Android command-line dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip rsync

      - name: Prepare Godot user directory and export templates
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          rsync -a "$GODOT_ANDROID/templates/" "$HOME/.local/share/godot/export_templates/4.4.stable/"
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --quit-after 5

      - name: Import project assets
        run: |
          set -euxo pipefail
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --import
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --quit-after 5

      - name: Ensure Android export preset/package identity
        working-directory: godot/Ironwake
        run: |
          set -euxo pipefail
          grep -q '^\[preset.0\]' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg
          grep -q 'org.ivanivorontsov.ironwake' export_presets.cfg || true

      - name: Export debug APK
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --export-debug "Android" "$GITHUB_WORKSPACE/build/ironwake-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/ironwake-debug.apk"
          file "$GITHUB_WORKSPACE/build/ironwake-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/build/ironwake-debug.apk" >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironwake-android-apk
          path: build/ironwake-debug.apk
          if-no-files-found: error
          retention-days: 14
