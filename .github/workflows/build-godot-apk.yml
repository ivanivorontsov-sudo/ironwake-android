name: Build Godot 4.4 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - graphics-overhaul-2026-09
    paths:
      - "godot/Ironwake/**"
      - ".github/workflows/build-godot-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      GODOT_ROOT: "${{ github.workspace }}/godot-bin"
      PROJECT_DIR: "${{ github.workspace }}/godot/Ironwake"
      TEMPLATES_DIR: "${{ github.workspace }}/godot-templates"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Godot 4.4 Linux binary
        run: |
          set -euxo pipefail
          mkdir -p "$GODOT_ROOT"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 180 --retry-all-errors \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_ROOT"
          mv "$GODOT_ROOT/Godot_v4.4-stable_linux.x86_64" "$GODOT_ROOT/godot"
          chmod +x "$GODOT_ROOT/godot"
          "$GODOT_ROOT/godot" --version

      - name: Download official Godot 4.4 Android export templates
        run: |
          set -euxo pipefail
          mkdir -p "$TEMPLATES_DIR"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 --retry-all-errors \
            -o /tmp/export-templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
          unzip -q /tmp/export-templates.tpz -d "$TEMPLATES_DIR"
          test -s "$TEMPLATES_DIR/templates/android_debug.apk"
          test -s "$TEMPLATES_DIR/templates/android_release.apk"

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android build prerequisites
        run: |
          set -euxo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip rsync

      - name: Install Godot export templates
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          rsync -a "$TEMPLATES_DIR/templates/" "$HOME/.local/share/godot/export_templates/4.4.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"

      - name: Configure Android SDK and Java
        run: |
          set -euxo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --quit-after 5

      - name: Import Godot project
        run: |
          set -euxo pipefail
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --import
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --quit-after 5

      - name: Verify Android export configuration
        run: |
          set -euxo pipefail
          grep -q '^name="Android"$' "$PROJECT_DIR/export_presets.cfg"
          grep -q '^platform="Android"$' "$PROJECT_DIR/export_presets.cfg"
          grep -q 'package/unique_name="org.ivanivorontsov.ironwake"' "$PROJECT_DIR/export_presets.cfg"

      - name: Export debug APK
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --export-debug "Android" "$GITHUB_WORKSPACE/build/ironwake-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/ironwake-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/build/ironwake-debug.apk" >/dev/null
          file "$GITHUB_WORKSPACE/build/ironwake-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironwake-android-apk
          path: build/ironwake-debug.apk
          if-no-files-found: error
          retention-days: 14
