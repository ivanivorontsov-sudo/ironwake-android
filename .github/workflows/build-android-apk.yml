name: Build IRONWAKE Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - graphics-overhaul-2026-09

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GODOT_ROOT: ${{ github.workspace }}/godot-bin
      PROJECT_DIR: ${{ github.workspace }}/godot/Ironwake
      TEMPLATES_DIR: ${{ github.workspace }}/godot-templates
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17 and tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip rsync
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          java -version
      - name: Download official Godot 4.4 Linux binary
        run: |
          set -euxo pipefail
          mkdir -p "$GODOT_ROOT"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$GODOT_ROOT"
          mv "$GODOT_ROOT/Godot_v4.4-stable_linux.x86_64" "$GODOT_ROOT/godot"
          chmod +x "$GODOT_ROOT/godot"
          "$GODOT_ROOT/godot" --version
      - name: Download official Godot 4.4 Android export templates
        run: |
          set -euxo pipefail
          mkdir -p "$TEMPLATES_DIR"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 600 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d "$TEMPLATES_DIR"
          test -s "$TEMPLATES_DIR/templates/android_debug.apk"
      - name: Bootstrap Android SDK
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o /tmp/cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q /tmp/cmdline.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Godot and export debug APK
        run: |
          set -euxo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          DEST="$HOME/.local/share/godot/export_templates/4.4.stable"
          mkdir -p "$DEST" "$HOME/.config/godot"
          rsync -a "$TEMPLATES_DIR/templates/" "$DEST/"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
export/android/java_sdk_path = "$JAVA_HOME"
EOF
          grep -q '^name="Android"$' "$PROJECT_DIR/export_presets.cfg"
          grep -q 'package/unique_name="org.ivanivorontsov.ironwake"' "$PROJECT_DIR/export_presets.cfg"
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --import
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_ROOT/godot" --headless --path "$PROJECT_DIR" --editor --export-debug "Android" "$GITHUB_WORKSPACE/build/ironwake-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/ironwake-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/build/ironwake-debug.apk" >/dev/null
      - name: Upload ironwake-android-apk
        uses: actions/upload-artifact@v4
        with:
          name: ironwake-android-apk
          path: build/ironwake-debug.apk
          if-no-files-found: error
          retention-days: 14
