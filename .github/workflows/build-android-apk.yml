name: Build IRONWAKE Android APK
on:
  workflow_dispatch:
  push:
    branches: [graphics-overhaul-2026-09]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download official Godot 4.4 binary
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip"
          mkdir -p godot-bin
          unzip -q /tmp/godot.zip -d godot-bin
          mv godot-bin/Godot_v4.4-stable_linux.x86_64 godot-bin/godot
          chmod +x godot-bin/godot
          godot-bin/godot --version
      - name: Download official Godot 4.4 Android templates
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          rsync -a /tmp/templates/templates/ "$HOME/.local/share/godot/export_templates/4.4.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure and export debug APK
        run: |
          set -euxo pipefail
          test -f godot/Ironwake/project.godot
          grep -q '^name="Android"$' godot/Ironwake/export_presets.cfg
          grep -q 'package/unique_name="org.ivanivorontsov.ironwake"' godot/Ironwake/export_presets.cfg
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
export/android/java_sdk_path = "$JAVA_HOME"
EOF
          godot-bin/godot --headless --path godot/Ironwake --editor --import
          mkdir -p build
          godot-bin/godot --headless --path godot/Ironwake --editor --export-debug Android build/ironwake-debug.apk
          test -s build/ironwake-debug.apk
          unzip -t build/ironwake-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ironwake-android-apk
          path: build/ironwake-debug.apk
          if-no-files-found: error
