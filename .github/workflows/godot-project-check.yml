name: Godot project check
on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-project-check.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-project-check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "IRONWAKE build workflow runner OK"
          git rev-parse HEAD
